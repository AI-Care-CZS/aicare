<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    {% include navbar.html %}

    <main>
      {% include header.html %}

      <div id="content" class="{% if page.layout == 'home' %}content home-wrap{% else %}container content{% endif %}">
          
        {{ content
          | replace: '<table', '<div class="table-responsive"><table'
          | replace: '</table>', '</table></div>'
          | replace: '<table>', '<table class="table">'
        }}

      </div>
    </main>

    {% include footer.html %}

  </body>
</html>
