---
layout: base
description: Template for homepage.
---

{{ content }}

{% if site.posts_on_home > 0 %}
<section class="home-news">
  <div class="container">
    <div class="section-head">
      <h2>Latest news</h2>
      <a href="{{ site.archive_permalink | relative_url }}">All updates</a>
    </div>
    <div class="row cards">
      {% for item in site.posts limit:site.posts_on_home %}
        <div class="col-md-6 col-lg-4">
          {% include card.html %}
        </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}
